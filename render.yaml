services:
  - type: web
    name: ghostcar-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ghostcar-db
          property: connectionString

databases:
  - name: ghostcar-db
    plan: free
